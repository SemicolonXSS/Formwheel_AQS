<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7ff"><title>AQS · Formwheel</title>
<style>
:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#24233b;background:#f7f7fc}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}a{color:inherit}header{background:#fff;border-bottom:1px solid #e9e7f2}nav,.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font-size:22px;font-weight:850;letter-spacing:-.5px}.muted{color:#76758b}.home{color:#6654cb;text-decoration:none;font-weight:700}.hero{margin:22px 0;padding:26px;border-radius:24px;background:linear-gradient(120deg,#6550c9,#9588ed);color:white}.hero h1{margin:6px 0}.hero .muted{color:#eeeaff}.meter{height:12px;border-radius:20px;background:#ffffff55;overflow:hidden;margin:13px 0 8px}.fill{height:100%;background:#fff;border-radius:20px;width:0;transition:width .3s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.stat,.card{background:#fff;border:1px solid #e9e7f2;border-radius:18px;padding:18px}.stat b{font-size:25px;display:block}.tabs{display:flex;gap:7px;overflow-x:auto;margin:22px 0 15px}.tab{border:0;background:#eae8f4;color:#67627d;padding:12px 19px;border-radius:13px;font-weight:750}.tab.active{background:#6250c7;color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card h3{margin:5px 0 8px}.pill{font-size:12px;border-radius:30px;background:#f0ecff;color:#614bbc;padding:5px 10px;font-weight:800;display:inline-block}.pill.gold{background:#fff1cd;color:#94640d}.pill.dark{background:#e8e6ed;color:#6a6673}.progress{height:8px;background:#ecebf6;border-radius:15px;overflow:hidden;margin:12px 0}.progress>div{background:#8977e8;height:100%}.btn{background:#6754cd;color:white;border:0;border-radius:11px;padding:10px 15px;font-weight:750}.btn:disabled{opacity:.48;cursor:default}.outline{background:#f1effa;color:#6553c4}.secretInput{padding:13px;border:1px solid #d6d2e7;border-radius:11px;max-width:100%;width:270px}.identity-card{border:2px solid #e0daf9;background:#fff;border-radius:16px;padding:15px;text-align:left}.identity-card.chosen{border-color:#7660db;background:#f1edff}.identity-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.identity-card b{display:block;font-size:21px;letter-spacing:2px}.identity-card small{display:block;color:#67617b;margin-top:5px}.identity-card:focus-visible{outline:3px solid #59d9ff}.secretBox{background:#25213f;color:#eeeaff;border-radius:20px;padding:22px}.secretBox p{color:#c9c2e5}.notice{margin:16px 0;color:#69677d;font-size:13px;line-height:1.6}footer{padding:30px;text-align:center;color:#77748b}.empty{padding:25px;text-align:center}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.status{font-size:12px} @media(max-width:640px){nav,.wrap{padding:15px}.grid{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px}.stat b{font-size:20px}.hero{padding:22px}.top{align-items:flex-start}.brand{font-size:19px}}
</style></head><body><header><nav class="top"><div><div class="brand">◉ Formwheel <span style="color:#705cd6">AQS</span></div><div class="muted" style="font-size:12px">Achievement · Quest · Secret</div></div><a class="home" href="/Formwheel/">← Hub</a></nav></header>
<main class="wrap"><section class="hero"><div class="row"><span>✦ 당신의 Formwheel 여정</span><span id="saveStatus" class="status">저장 확인 중</span></div><h1 id="level">LEVEL 1</h1><div id="levelDescription">프로젝트를 탐험하며 성장하세요!</div><div class="meter"><div class="fill" id="xpBar"></div></div><div class="row"><small id="xpDetail"></small><small id="nextDetail"></small></div></section><div class="stats"><div class="stat"><span class="muted">🏅 업적</span><b id="achCount">0</b></div><div class="stat"><span class="muted">📋 오늘 미션</span><b id="questCount">0</b></div><div class="stat"><span class="muted">🔮 시크릿</span><b id="secretCount">0</b></div></div>
<div class="tabs" role="tablist" aria-label="AQS 화면 선택"><button class="tab active" data-tab="quests">📋 Quest</button><button class="tab" data-tab="achievements">🏅 Achievement</button><button class="tab" data-tab="identity">🪐 Identity</button><button class="tab" data-tab="secrets">🔮 Secret</button></div><div id="content" aria-live="polite"></div><p class="notice" id="notice">일일 퀘스트는 한국 시간 0시에 새로 시작해요. 기록은 이 브라우저에 먼저 저장되며, 계정 연결이 가능한 경우 클라우드에도 동기화됩니다.</p></main><footer>Formwheel · AQS v1.0</footer>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getDatabase,ref,get,set} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
const config={apiKey:"AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE",authDomain:"formwheel.firebaseapp.com",databaseURL:"https://formwheel-default-rtdb.firebaseio.com",projectId:"formwheel",storageBucket:"formwheel.firebasestorage.app",messagingSenderId:"431583088241",appId:"1:431583088241:web:74e0e34ea1e3e1170c55d0",measurementId:"G-T372YXDF8D"};
const app=initializeApp(config),auth=getAuth(app),db=getDatabase(app);
const KEY='formwheel.aqs.v1',EVENT_KEY='formwheel.aqs.events.v1';
const achievements=[{id:'welcome',name:'첫 발걸음',desc:'AQS에 처음 방문',xp:20,rarity:'일반'},{id:'daily',name:'꾸준한 탐험가',desc:'출석 퀘스트 완료',xp:30,rarity:'일반'},{id:'explorer',name:'프로젝트 여행자',desc:'서로 다른 프로젝트 3개 탐험',xp:80,rarity:'희귀'},{id:'secret',name:'메아리의 발견',desc:'숨겨진 메아리 발견',xp:120,rarity:'에픽'}];
const defaultState=()=>({version:1,xp:0,claimed:{},unlocked:{},secrets:{},visitedProjects:{},daily:{},featuredId:'',identity:'',lastUpdated:0});
let state=defaultState(),tab='quests',uid=null,saveTimer=null,cloudEnabled=false;
const safeParse=(s)=>{try{return JSON.parse(s)}catch{return null}};
const dateKey=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const els=(id)=>document.getElementById(id);
const escapeHtml=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadLocal(){const s=safeParse(localStorage.getItem(KEY));if(s&&s.version===1)state={...defaultState(),...s}}
function save(){state.lastUpdated=Date.now();localStorage.setItem(KEY,JSON.stringify(state));els('saveStatus').textContent=cloudEnabled?'로컬 저장됨 · 동기화 중':'이 기기에 저장됨';clearTimeout(saveTimer);if(cloudEnabled&&uid)saveTimer=setTimeout(async()=>{try{await set(ref(db,'aqs/v1/users/'+uid),state);els('saveStatus').textContent='클라우드 동기화됨'}catch{cloudEnabled=false;els('saveStatus').textContent='이 기기에 저장됨'}},650)}
function levelFor(xp){return Math.floor(Math.sqrt(xp/100))+1}
function unlock(id){if(state.unlocked[id])return;const a=achievements.find(x=>x.id===id);if(!a)return;state.unlocked[id]=Date.now();state.xp+=a.xp}
function syncAchievements(){unlock('welcome');if(state.daily[dateKey()]?.checkin)unlock('daily');if(Object.keys(state.visitedProjects).length>=3)unlock('explorer');if(state.secrets.echo)unlock('secret')}
function questItems(){const d=state.daily[dateKey()]||{};return [{id:'checkin',title:'오늘도 반가워!',desc:'오늘의 출석을 기록해 보세요.',target:1,count:d.checkin?1:0,xp:25},{id:'projects',title:'프로젝트 탐험',desc:'서로 다른 프로젝트 3개 방문',target:3,count:Math.min(3,Object.keys(state.visitedProjects).length),xp:50},{id:'echo',title:'비밀의 메아리',desc:'AQS에 숨어 있는 Secret 하나 발견',target:1,count:state.secrets.echo?1:0,xp:70}]}
function selectFeatured(id){if(id&&!state.unlocked[id])return;state.featuredId=id;save();render()}
function claim(id){const k=dateKey()+':'+id, q=questItems().find(x=>x.id===id);if(!q||q.count<q.target||state.claimed[k])return;state.claimed[k]=true;state.xp+=q.xp;save();render()}
function checkin(){state.daily[dateKey()]={...(state.daily[dateKey()]||{}),checkin:true};syncAchievements();save();render()}
function registerProject(name){const p=String(name||'').toLowerCase().trim();if(!/^[a-z][a-z0-9_-]{1,35}$/.test(p)||p==='aqs')return;state.visitedProjects[p]=Date.now();syncAchievements();save();render()}
function checkSecret(){const input=els('secretCode');if(!input)return;const code=input.value.trim().toUpperCase();if(code==='ECHO'&&!state.secrets.echo){state.secrets.echo=Date.now();syncAchievements();save();render();return}els('secretMessage').textContent=state.secrets.echo?'이미 발견한 비밀이에요.':'아직 열리지 않았어요. 다른 단서를 찾아보세요.'}
const identities={ECHO:'기억과 연결',NOVA:'도전과 성장',VOID:'미지와 탐험',RIFT:'변화와 발견'};
function chooseIdentity(id){if(!Object.hasOwn(identities,id))return;state.identity=id;save();render()}
function render(){syncAchievements();const lvl=levelFor(state.xp),low=100*(lvl-1)**2,high=100*lvl**2;els('level').textContent='LEVEL '+lvl;els('xpBar').style.width=(100*(state.xp-low)/(high-low))+'%';els('xpDetail').textContent=state.xp+' XP';els('nextDetail').textContent='다음 레벨까지 '+(high-state.xp)+' XP';els('achCount').textContent=Object.keys(state.unlocked).length+'/'+achievements.length;els('secretCount').textContent=Object.keys(state.secrets).length+'/1';els('questCount').textContent=questItems().filter(q=>state.claimed[dateKey()+':'+q.id]).length+'/'+questItems().length;document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-selected',String(b.dataset.tab===tab))});
if(tab==='quests'){els('content').innerHTML='<div class="grid">'+questItems().map(q=>{const done=!!state.claimed[dateKey()+':'+q.id];return '<article class="card"><span class="pill">'+q.xp+' XP</span><h3>'+q.title+'</h3><p class="muted">'+q.desc+'</p><div class="progress"><div style="width:'+(100*q.count/q.target)+'%"></div></div><div class="row"><small>'+q.count+'/'+q.target+'</small><button class="btn" data-claim="'+q.id+'" '+(q.count<q.target||done?'disabled':'')+'>'+(done?'수령 완료':q.count===q.target?'보상 받기':'진행 중')+'</button></div></article>'}).join('')+'</div><p class="notice"><button class="btn outline" id="checkin" '+(state.daily[dateKey()]?.checkin?'disabled':'')+'>'+(state.daily[dateKey()]?.checkin?'✓ 오늘 출석 완료':'오늘 출석하기')+'</button></p>'}
else if(tab==='identity'){els('content').innerHTML='<section class="card"><h2>🪐 나의 Orbit Identity</h2><p class="muted">나만의 네 글자 단어를 선택해 보세요. 언제든 무료로 변경할 수 있고 XP·업적은 그대로 유지됩니다.</p><div class="identity-list">'+Object.entries(identities).map(([id,desc])=>'<button type="button" class="identity-card '+(state.identity===id?'chosen':'')+'" data-identity="'+id+'" aria-pressed="'+(state.identity===id)+'"><b>'+id+'</b><small>'+desc+'</small></button>').join('')+'</div><p class="notice">현재 Identity: <strong>'+(state.identity||'미선택')+'</strong> · <a href="https://semicolonxss.github.io/Formwheel_Quiz/">Quiz에서 사용하기 →</a></p></section>'}
else if(tab==='achievements'){els('content').innerHTML='<section class="card" style="margin-bottom:14px"><h3>🌟 대표 업적 선택</h3><p class="muted">획득한 업적 하나를 Hub 프로필 사진 옆에 표시할 수 있어요.</p><select id="featuredChoice" class="secretInput" aria-label="대표 업적 선택"><option value="">선택 안 함</option>'+achievements.filter(a=>state.unlocked[a.id]).map(a=>'<option value="'+a.id+'" '+(state.featuredId===a.id?'selected':'')+'>'+a.name+'</option>').join('')+'</select> <button class="btn" id="saveFeatured">저장</button></section><div class="grid">'+achievements.map(a=>{const yes=!!state.unlocked[a.id];return '<article class="card"><span class="pill '+(a.rarity==='에픽'?'gold':!yes?'dark':'')+'">'+a.rarity+'</span><h3>'+(yes?'🏅 ':'🔒 ')+a.name+'</h3><p class="muted">'+a.desc+'</p><div class="row"><small>'+a.xp+' XP</small><strong>'+(yes?'획득 완료':'미획득')+'</strong></div></article>'}).join('')+'</div>'}
else{els('content').innerHTML='<section class="secretBox"><div class="pill">숨겨진 기록 · 01</div><h2>🔮 메아리의 방</h2><p>소리를 내면 돌아오는 것. 다섯 글자의 영어 단어를 떠올려 봐.</p><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><input class="secretInput" id="secretCode" placeholder="비밀 코드" aria-label="비밀 코드"><button class="btn" id="submitSecret">확인</button></div><p id="secretMessage">'+(state.secrets.echo?'✓ 비밀을 발견했어요!':'아직 발견하지 못한 시크릿이 있어요.')+'</p></section>'}
document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>claim(b.dataset.claim));const c=els('checkin');if(c)c.onclick=checkin;const s=els('submitSecret');if(s)s.onclick=checkSecret;document.querySelectorAll('[data-identity]').forEach(b=>b.onclick=()=>chooseIdentity(b.dataset.identity));const v=els('saveFeatured');if(v)v.onclick=()=>selectFeatured(els('featuredChoice').value)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
window.FormwheelAQS={recordProjectVisit:registerProject,recordEvent:(type,detail)=>{if(type==='project_visit')registerProject(detail?.project)}};
// Cross-page projects under the same origin may append named visits to the shared event queue.
function consumeEvents(){const events=safeParse(localStorage.getItem(EVENT_KEY));if(!Array.isArray(events))return;for(const e of events.slice(-100)){if(e&&e.type==='project_visit'&&typeof e.project==='string')registerProject(e.project)}localStorage.removeItem(EVENT_KEY)}
window.addEventListener('storage',e=>{if(e.key===EVENT_KEY)consumeEvents()});
loadLocal();consumeEvents();syncAchievements();save();render();
onAuthStateChanged(auth,async user=>{if(!user){els('saveStatus').textContent='이 기기에 저장됨';return}uid=user.uid;try{const snap=await get(ref(db,'aqs/v1/users/'+uid));const remote=snap.val();if(remote&&remote.version===1){state={...defaultState(),...remote,claimed:{...remote.claimed,...state.claimed},unlocked:{...remote.unlocked,...state.unlocked},secrets:{...remote.secrets,...state.secrets},visitedProjects:{...remote.visitedProjects,...state.visitedProjects},daily:{...remote.daily,...state.daily},featuredId:state.featuredId||remote.featuredId||'',identity:(remote.lastUpdated||0)>(state.lastUpdated||0)?(remote.identity||''):(state.identity||remote.identity||''),xp:Math.max(remote.xp||0,state.xp||0)};localStorage.setItem(KEY,JSON.stringify(state))}cloudEnabled=true;syncAchievements();save();render()}catch{cloudEnabled=false;els('saveStatus').textContent='이 기기에 저장됨'}});
</script></body></html>
