 let changed=false;
 for(const src of gameAchievementSources){

// Spotlight uses the same github.io origin; import recorded rewards into AQS once per day/mission.
function syncSpotlightXP(){
 const visits=safeParse(localStorage.getItem('formwheel.spotlight.rewards.v1'));
 const missions=safeParse(localStorage.getItem('formwheel.spotlight.missions.v1'));
 const dates=Array.isArray(visits?.claimed)?[...new Set(visits.claimed.filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&d<=dateKey()))].sort():[];
 const earned=state.spotlightRewards||{};
 let changed=false,streak=0,prev='';
 for(const day of dates){
   const delta=Math.round((Date.parse(day+'T00:00:00Z')-Date.parse(prev+'T00:00:00Z'))/86400000);
   streak=delta===1?streak+1:1;
   const id='visit:'+day;
   if(!earned[id]){earned[id]=10;state.xp+=10;changed=true;}
   if(streak%3===0){const bonus='streak:'+day;if(!earned[bonus]){earned[bonus]=15;state.xp+=15;changed=true;}}
   prev=day;
 }
 if(missions&&typeof missions==='object'&&!Array.isArray(missions))
   for(const [token,ok] of Object.entries(missions)){
     if(ok!==true||!/^\d{4}-\d{2}-\d{2}:(Reflex|Cook|Decode|Clicker|Time|Marble|GCrown)$/.test(token)||token.slice(0,10)>dateKey())continue;
     const id='mission:'+token;
     if(!earned[id]){earned[id]=20;state.xp+=20;changed=true;}
   }
 state.spotlightRewards=earned;
 if(changed)save();
 return changed;
}
