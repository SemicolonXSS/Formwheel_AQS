</style></head><body><header><nav class="top"><div><a class="brand brand-link" href="https://semicolonxss.github.io/Formwheel/" aria-label="Formwheel Hub로 이동"><img src="https://semicolonxss.github.io/Formwheel/assets/formwheel-favicon.svg" alt="" width="29" height="29">Formwheel <span style="color:#705cd6">AQS</span></a><div class="muted" style="font-size:12px">Achievement · Quest · Secret</div></div><a class="home" href="/Formwheel/">← Hub</a></nav></header>
<main class="wrap"><section class="hero"><div class="row"><span>✦ 당신의 Formwheel 여정</span><span id="saveStatus" class="status">저장 확인 중</span></div><h1 id="level">LEVEL 1</h1><div id="levelDescription">프로젝트를 탐험하며 성장하세요!</div><div class="meter"><div class="fill" id="xpBar"></div></div><div class="row"><small id="xpDetail"></small><small id="nextDetail"></small></div></section><div class="stats"><div class="stat"><span class="muted">🏅 업적</span><b id="achCount">0</b></div><div class="stat"><span class="muted">📋 오늘 미션</span><b id="questCount">0</b></div><div class="stat"><span class="muted">🔮 시크릿</span><b id="secretCount">0</b></div></div>
<div class="tabs" role="tablist" aria-label="AQS 화면 선택"><button class="tab active" data-tab="quests">📋 Quest</button><button class="tab" data-tab="achievements">🏅 Achievement</button><button class="tab" data-tab="identity">🪐 Identity</button><button class="tab" data-tab="secrets">🔮 Secret</button></div><div id="content" aria-live="polite"></div><p class="notice" id="notice">일일 퀘스트는 한국 시간 0시에 새로 시작해요. 기록은 이 브라우저에 먼저 저장되며, 계정 연결이 가능한 경우 클라우드에도 동기화됩니다.</p></main><footer>Formwheel · AQS v1.0</footer>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getDatabase,ref,get,set} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
const config={apiKey:"AIzaSyBreTSe1m0-xlbF4aupnU5isRZCihR25IE",authDomain:"formwheel.firebaseapp.com",databaseURL:"https://formwheel-default-rtdb.firebaseio.com",projectId:"formwheel",storageBucket:"formwheel.firebasestorage.app",messagingSenderId:"431583088241",appId:"1:431583088241:web:74e0e34ea1e3e1170c55d0",measurementId:"G-T372YXDF8D"};
const app=initializeApp(config),auth=getAuth(app),db=getDatabase(app);
const KEY='formwheel.aqs.v1',EVENT_KEY='formwheel.aqs.events.v1';
const achievements=[{id:'welcome',name:'첫 발걸음',desc:'AQS에 처음 방문',xp:20,rarity:'일반'},{id:'daily',name:'꾸준한 탐험가',desc:'출석 퀘스트 완료',xp:30,rarity:'일반'},{id:'explorer',name:'프로젝트 여행자',desc:'서로 다른 프로젝트 3개 탐험',xp:80,rarity:'희귀'},{id:'secret',name:'메아리의 발견',desc:'숨겨진 메아리 발견',xp:120,rarity:'에픽'},{id:'identity',name:'궤도에 오른 자',desc:'Orbit Identity 선택',xp:35,rarity:'일반'},{id:'twoSecrets',name:'비밀 추적자',desc:'Secret 2개 발견',xp:80,rarity:'희귀'},{id:'fourSecrets',name:'암호 해독가',desc:'Secret 4개 발견',xp:160,rarity:'에픽'},{id:'fiveProjects',name:'궤도 여행자',desc:'서로 다른 프로젝트 5개 탐험',xp:140,rarity:'희귀'},{id:'questsThree',name:'임무 수행자',desc:'누적 퀘스트 보상 3회 수령',xp:90,rarity:'희귀'},{id:'questsTen',name:'미션 마스터',desc:'누적 퀘스트 보상 10회 수령',xp:250,rarity:'에픽'},{id:'allSecrets',name:'숨겨진 궤도의 기록자',desc:'AQS Secret 모두 발견',xp:300,rarity:'전설'}];
const secretCatalog=[{id:'echo',name:'메아리의 방',hint:'소리를 내면 돌아오는 네 글자',code:'ECHO',added:'2026-10-17'},{id:'nova',name:'빛의 탄생',hint:'새 별이 폭발적으로 밝아지는 순간',code:'NOVA',added:'2026-10-17'},{id:'void',name:'빈자리의 기록',hint:'아무것도 없는 공간을 가리키는 단어',code:'VOID',added:'2026-10-17'},{id:'rift',name:'틈새의 신호',hint:'공간에 생긴 갈라진 틈',code:'RIFT',added:'2026-10-17'},{id:'orbit',name:'되돌아오는 궤도',hint:'Formwheel 전체 테마의 영단어',code:'ORBIT',added:'2026-10-17'},{id:'semicolon',name:'창조자의 흔적',hint:'프로젝트 제작자의 이름에 담긴 문장부호',code:'SEMICOLON',added:'2026-10-17'}];
const HUB_SECRET_KEY='formwheel.secret.v1',HUB_SECRET_TOTAL=38;
function hubSecrets(){try{const v=JSON.parse(localStorage.getItem(HUB_SECRET_KEY)||'{}');return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch{return {}}}
function hubSecretCount(){return Object.keys(hubSecrets()).filter(k=>Number.isInteger(+k)&&+k>=1&&+k<=HUB_SECRET_TOTAL).length}
const FOLD_KEY='formwheel.aqs.catalog.fold.v1';let foldState={...{recent:true,challenge:true,new:true},...(JSON.parse(localStorage.getItem(FOLD_KEY)||'null')||{})};
const defaultState=()=>({version:1,xp:0,claimed:{},unlocked:{},secrets:{},visitedProjects:{},daily:{},featuredId:'',identity:'',identitySeen:{},nullUnlocked:false,lastUpdated:0});
let state=defaultState(),tab='quests',uid=null,saveTimer=null,cloudEnabled=false;
const safeParse=(s)=>{try{return JSON.parse(s)}catch{return null}};
const dateKey=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const els=(id)=>document.getElementById(id);
const escapeHtml=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadLocal(){const s=safeParse(localStorage.getItem(KEY));if(s&&s.version===1)state={...defaultState(),...s}}
function save(){state.lastUpdated=Date.now();localStorage.setItem(KEY,JSON.stringify(state));els('saveStatus').textContent=cloudEnabled?'로컬 저장됨 · 동기화 중':'이 기기에 저장됨';clearTimeout(saveTimer);if(cloudEnabled&&uid)saveTimer=setTimeout(async()=>{try{await set(ref(db,'aqs/v1/users/'+uid),state);els('saveStatus').textContent='클라우드 동기화됨'}catch{cloudEnabled=false;els('saveStatus').textContent='이 기기에 저장됨'}},650)}
function levelFor(xp){return Math.floor(Math.sqrt(xp/100))+1}
function unlock(id){if(state.unlocked[id])return;const a=achievements.find(x=>x.id===id);if(!a)return;state.unlocked[id]=Date.now();state.xp+=a.xp}
function syncAchievements(){unlock('welcome');if(state.daily[dateKey()]?.checkin)unlock('daily');if(Object.keys(state.visitedProjects).length>=3)unlock('explorer');if(hubSecrets()[32])unlock('secret');if(state.identity)unlock('identity');if(hubSecretCount()>=2)unlock('twoSecrets');if(hubSecretCount()>=4)unlock('fourSecrets');if(hubSecretCount()===HUB_SECRET_TOTAL)unlock('allSecrets');if(Object.keys(state.visitedProjects).length>=5)unlock('fiveProjects');const c=Object.keys(state.claimed).length;if(c>=3)unlock('questsThree');if(c>=10)unlock('questsTen')}
function questItems(){const d=state.daily[dateKey()]||{};return [{id:'checkin',title:'오늘도 반가워!',desc:'오늘의 출석을 기록해 보세요.',target:1,count:d.checkin?1:0,xp:25},{id:'projects',title:'프로젝트 탐험',desc:'서로 다른 프로젝트 3개 방문',target:3,count:Math.min(3,Object.keys(state.visitedProjects).length),xp:50},{id:'echo',title:'비밀의 메아리',desc:'AQS에 숨어 있는 Secret 하나 발견',target:1,count:hubSecrets()[32]?1:0,xp:70},{id:'secretTwo',title:'수상한 발자국',desc:'Secret 2개 발견하기',target:2,count:Math.min(2,hubSecretCount()),xp:90},{id:'identity',title:'나만의 궤도',desc:'Orbit Identity 선택하기',target:1,count:state.identity?1:0,xp:30},{id:'secretFour',title:'비밀 수집가',desc:'Secret 4개 발견하기',target:4,count:Math.min(4,hubSecretCount()),xp:130},{id:'projectsFive',title:'넓은 세계',desc:'서로 다른 프로젝트 5개 방문',target:5,count:Math.min(5,Object.keys(state.visitedProjects).length),xp:100}]}
function selectFeatured(id){if(id&&!state.unlocked[id])return;state.featuredId=id;save();render()}
function claim(id){const k=dateKey()+':'+id, q=questItems().find(x=>x.id===id);if(!q||q.count<q.target||state.claimed[k])return;state.claimed[k]=true;state.xp+=q.xp;syncAchievements();save();render()}
function checkin(){state.daily[dateKey()]={...(state.daily[dateKey()]||{}),checkin:true};syncAchievements();save();render()}
function registerProject(name){const p=String(name||'').toLowerCase().trim();if(!/^[a-z][a-z0-9_-]{1,35}$/.test(p)||p==='aqs')return;state.visitedProjects[p]=Date.now();syncAchievements();save();render()}
function checkSecret(){const input=els('secretCode');if(!input)return;const code=input.value.trim().toUpperCase();const found=secretCatalog.find(x=>x.code===code);if(found&&!state.secrets[found.id]){state.secrets[found.id]=Date.now();checkNullUnlock();syncAchievements();save();render();els('secretMessage').textContent='✓ '+found.name+' 발견!';return}els('secretMessage').textContent=found?'이미 발견한 비밀이에요.':'아직 열리지 않았어요. 다른 단서를 찾아보세요.'}
const identities={ECHO:'기억과 연결',NOVA:'도전과 성장',VOID:'미지와 탐험',RIFT:'변화와 발견',NULL:'존재하지 않는 존재'};
function checkNullUnlock(){if(state.nullUnlocked)return;if(state.secrets?.echo&&['ECHO','NOVA','VOID','RIFT'].every(id=>state.identitySeen?.[id]))state.nullUnlocked=true}
function chooseIdentity(id){if(!Object.hasOwn(identities,id)||(id==='NULL'&&!state.nullUnlocked))return;state.identity=id;if(id!=='NULL')state.identitySeen={...state.identitySeen,[id]:true};checkNullUnlock();syncAchievements();save();render()}
function render(){checkNullUnlock();syncAchievements();const lvl=levelFor(state.xp),low=100*(lvl-1)**2,high=100*lvl**2;els('level').textContent='LEVEL '+lvl;els('xpBar').style.width=(100*(state.xp-low)/(high-low))+'%';els('xpDetail').textContent=state.xp+' XP';els('nextDetail').textContent='다음 레벨까지 '+(high-state.xp)+' XP';els('achCount').textContent=Object.keys(state.unlocked).length+'/'+achievements.length;els('secretCount').textContent=hubSecretCount()+'/'+HUB_SECRET_TOTAL;els('questCount').textContent=questItems().filter(q=>state.claimed[dateKey()+':'+q.id]).length+'/'+questItems().length;document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-selected',String(b.dataset.tab===tab))});
if(tab==='quests'){els('content').innerHTML='<div class="grid">'+questItems().map(q=>{const done=!!state.claimed[dateKey()+':'+q.id];return '<article class="card"><span class="pill">'+q.xp+' XP</span><h3>'+q.title+'</h3><p class="muted">'+q.desc+'</p><div class="progress"><div style="width:'+(100*q.count/q.target)+'%"></div></div><div class="row"><small>'+q.count+'/'+q.target+'</small><button class="btn" data-claim="'+q.id+'" '+(q.count<q.target||done?'disabled':'')+'>'+(done?'수령 완료':q.count===q.target?'보상 받기':'진행 중')+'</button></div></article>'}).join('')+'</div><p class="notice"><button class="btn outline" id="checkin" '+(state.daily[dateKey()]?.checkin?'disabled':'')+'>'+(state.daily[dateKey()]?.checkin?'✓ 오늘 출석 완료':'오늘 출석하기')+'</button></p>'}
else if(tab==='identity'){els('content').innerHTML='<section class="card"><h2>🪐 나의 Orbit Identity</h2><p class="muted">나만의 네 글자 단어를 선택해 보세요. 언제든 무료로 변경할 수 있고 XP·업적은 그대로 유지됩니다.</p><div class="identity-list">'+Object.entries(identities).map(([id,desc])=>'<button type="button" class="identity-card '+(state.identity===id?'chosen':'')+'" data-identity="'+id+'" '+(id==='NULL'&&!state.nullUnlocked?'disabled aria-label="잠긴 히든 Identity"':'')+' aria-pressed="'+(state.identity===id)+'"><b>'+(id==='NULL'&&!state.nullUnlocked?'????':id)+'</b><small>'+(id==='NULL'&&!state.nullUnlocked?'🔒 잠긴 Identity':desc)+'</small></button>').join('')+'</div><p class="notice">현재 Identity: <strong>'+(state.identity||'미선택')+'</strong> · <a href="https://semicolonxss.github.io/Formwheel_Quiz/">Quiz에서 사용하기 →</a></p></section>'}
else if(tab==='achievements'){els('content').innerHTML='<section class="card" style="margin-bottom:14px"><h3>🌟 대표 업적 선택</h3><p class="muted">획득한 업적 하나를 Hub 프로필 사진 옆에 표시할 수 있어요.</p><select id="featuredChoice" class="secretInput" aria-label="대표 업적 선택"><option value="">선택 안 함</option>'+achievements.filter(a=>state.unlocked[a.id]).map(a=>'<option value="'+a.id+'" '+(state.featuredId===a.id?'selected':'')+'>'+a.name+'</option>').join('')+'</select> <button class="btn" id="saveFeatured">저장</button></section><div class="grid">'+achievements.map(a=>{const yes=!!state.unlocked[a.id];return '<article class="card"><span class="pill '+(a.rarity==='에픽'?'gold':!yes?'dark':'')+'">'+a.rarity+'</span><h3>'+(yes?'🏅 ':'🔒 ')+a.name+'</h3><p class="muted">'+a.desc+'</p><div class="row"><small>'+a.xp+' XP</small><strong>'+(yes?'획득 완료':'미획득')+'</strong></div></article>'}).join('')+'</div>'}
else{els('content').innerHTML='<section class="card"><h2>🔮 Hub Secret 통합 도감</h2><p class="muted">Hub에서 사용하던 38개 Secret과 퍼즐을 그대로 이용할 수 있어요. 접은 상태에서는 최근 발견 · 도전해보세요 · 최근 추가에서 각각 하나씩만 보여요.</p></section><iframe id="hubSecretFrame" title="Formwheel Secret 통합 도감" loading="lazy" src="https://semicolonxss.github.io/Formwheel/secret/" style="display:block;width:100%;min-height:850px;border:0;border-radius:18px;background:#fff" referrerpolicy="strict-origin-when-cross-origin"></iframe>';const frame=els('hubSecretFrame');frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;const resize=()=>{frame.style.height=Math.max(850,doc.documentElement.scrollHeight,doc.body.scrollHeight)+'px'};resize();new ResizeObserver(resize).observe(doc.body);doc.defaultView.addEventListener('resize',resize)}catch{frame.style.height='1800px'}})}

document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>claim(b.dataset.claim));const c=els('checkin');if(c)c.onclick=checkin;const s=els('submitSecret');if(s)s.onclick=checkSecret;document.querySelectorAll('[data-identity]').forEach(b=>b.onclick=()=>chooseIdentity(b.dataset.identity));const v=els('saveFeatured');if(v)v.onclick=()=>selectFeatured(els('featuredChoice').value)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
window.FormwheelAQS={recordProjectVisit:registerProject,recordEvent:(type,detail)=>{if(type==='project_visit')registerProject(detail?.project)}};
// Cross-page projects under the same origin may append named visits to the shared event queue.
function consumeEvents(){const events=safeParse(localStorage.getItem(EVENT_KEY));if(!Array.isArray(events))return;for(const e of events.slice(-100)){if(e&&e.type==='project_visit'&&typeof e.project==='string')registerProject(e.project)}localStorage.removeItem(EVENT_KEY)}
window.addEventListener('storage',e=>{if(e.key===EVENT_KEY)consumeEvents();if(e.key===HUB_SECRET_KEY){syncAchievements();save();render()}});
loadLocal();consumeEvents();syncAchievements();save();render();
onAuthStateChanged(auth,async user=>{if(!user){els('saveStatus').textContent='이 기기에 저장됨';return}uid=user.uid;try{const snap=await get(ref(db,'aqs/v1/users/'+uid));const remote=snap.val();if(remote&&remote.version===1){state={...defaultState(),...remote,claimed:{...remote.claimed,...state.claimed},unlocked:{...remote.unlocked,...state.unlocked},secrets:{...remote.secrets,...state.secrets},visitedProjects:{...remote.visitedProjects,...state.visitedProjects},daily:{...remote.daily,...state.daily},featuredId:state.featuredId||remote.featuredId||'',identity:(remote.lastUpdated||0)>(state.lastUpdated||0)?(remote.identity||''):(state.identity||remote.identity||''),identitySeen:{...remote.identitySeen,...state.identitySeen},nullUnlocked:!!(remote.nullUnlocked||state.nullUnlocked),xp:Math.max(remote.xp||0,state.xp||0)};localStorage.setItem(KEY,JSON.stringify(state))}cloudEnabled=true;syncAchievements();save();render()}catch{cloudEnabled=false;els('saveStatus').textContent='이 기기에 저장됨'}});
</script></body></html>
